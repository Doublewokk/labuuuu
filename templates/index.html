<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Ultimate Portfolio System
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#111827;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #2563eb;
}

header h1{
    color:#60a5fa;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    cursor:pointer;
    transition:0.3s;
}

nav a:hover{
    color:#60a5fa;
}

.container{
    width:90%;
    max-width:1300px;
    margin:auto;
}

.hero{
    padding:80px 0;
    text-align:center;
}

.hero h2{
    font-size:60px;
    margin-bottom:20px;
    color:#60a5fa;
}

.hero p{
    color:#cbd5e1;
    font-size:20px;
    line-height:1.7;
}

.section-title{
    text-align:center;
    margin:60px 0 30px;
    color:#60a5fa;
    font-size:40px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.stat-box{
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

.stat-box h2{
    font-size:40px;
    color:#60a5fa;
}

form{
    background:#1e293b;
    padding:30px;
    border-radius:25px;
}

input,
textarea{
    width:100%;
    margin-top:15px;
    padding:15px;
    background:#0f172a;
    border:none;
    border-radius:10px;
    color:white;
}

button{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.search-box{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    margin-top:20px;
}

.card img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}

footer{
    margin-top:60px;
    background:#111827;
    padding:30px;
    text-align:center;
}

</style>

</head>

<body>

<header>

<h1>
Portfolio System
</h1>

<nav>

<a onclick="scrollToSection('portfolio')">
Портфолио
</a>

<a onclick="scrollToSection('statistics')">
Статистика
</a>

<a onclick="scrollToSection('search')">
Поиск
</a>

</nav>

</header>

<div class="container">

<section class="hero">

<h2>
Ultimate Portfolio System
</h2>

<p>
Полноценная система цифровых
портфолио для IT-разработчиков,
школьников и студентов.
</p>

</section>

<section id="statistics">

<h2 class="section-title">
Статистика
</h2>

<div class="stats">

<div class="stat-box">
<h2 id="usersCount">0</h2>
<p>Пользователей</p>
</div>

<div class="stat-box">
<h2 id="viewsCount">0</h2>
<p>Просмотров</p>
</div>

<div class="stat-box">
<h2 id="activeCount">0</h2>
<p>Активных профилей</p>
</div>

</div>

</section>

<section id="portfolio">

<h2 class="section-title">
Создание портфолио
</h2>

<form>

<input type="text"
id="name"
placeholder="Имя">

<textarea
id="about"
placeholder="О себе"></textarea>

<input type="text"
id="skills"
placeholder="Навыки">

<input type="text"
id="projects"
placeholder="Проекты">

<input type="text"
id="contacts"
placeholder="Контакты">

<input type="text"
id="github"
placeholder="GitHub">

<input type="text"
id="category"
placeholder="Категория">

<input type="text"
id="education"
placeholder="Образование">

<input type="text"
id="experience"
placeholder="Опыт">

<input type="text"
id="achievements"
placeholder="Достижения">

<input type="text"
id="photo"
placeholder="Ссылка на фото">

<button type="button"
onclick="savePortfolio()">

Сохранить портфолио

</button>

</form>

</section>

<section id="search">

<h2 class="section-title">
Поиск пользователей
</h2>

<div class="search-box">

<input type="text"
id="searchInput"
placeholder="Введите имя или навык">

<button onclick="searchUsers()">
Поиск
</button>

</div>

<div id="searchResults"></div>

</section>

</div>

<footer>

Ultimate Portfolio System © 2026

</footer>

<script>

function scrollToSection(id){

    document.getElementById(id)
    .scrollIntoView({
        behavior:"smooth"
    });

}

async function savePortfolio(){

    const portfolio = {

        name:
        document.getElementById("name").value,

        about:
        document.getElementById("about").value,

        skills:
        document.getElementById("skills").value,

        projects:
        document.getElementById("projects").value,

        contacts:
        document.getElementById("contacts").value,

        github:
        document.getElementById("github").value,

        category:
        document.getElementById("category").value,

        education:
        document.getElementById("education").value,

        experience:
        document.getElementById("experience").value,

        achievements:
        document.getElementById("achievements").value,

        photo:
        document.getElementById("photo").value

    };

    await fetch("/save", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(portfolio)

    });

    alert("Портфолио сохранено!");

    loadStats();

}

async function loadStats(){

    const response =
        await fetch("/stats");

    const data =
        await response.json();

    document.getElementById("usersCount")
        .innerHTML = data.users;

    document.getElementById("viewsCount")
        .innerHTML = data.views;

    document.getElementById("activeCount")
        .innerHTML = data.active;

}

async function searchUsers(){

    const query =
        document.getElementById("searchInput")
        .value;

    const response =
        await fetch(`/search/${query}`);

    const users =
        await response.json();

    const results =
        document.getElementById("searchResults");

    results.innerHTML = "";

    users.forEach(user => {

        results.innerHTML += `

        <div class="card">

        <img src="${user.photo}">

        <h2>${user.name}</h2>

        <p>🛠 ${user.skills}</p>

        <p>💼 ${user.category}</p>

        <p>📞 ${user.contacts}</p>

        <p>🌐 ${user.github}</p>

        </div>

        `;

    });

}

loadStats();

</script>

</body>
</html>
